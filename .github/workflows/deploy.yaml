name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    actions: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                version: 12.15.0
            - uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "pnpm"

            - name: install deps
              run: pnpm i --frozen-lockfile

            - name: build
              run: pnpm build

            - name: identify thing
              run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: deploy
              run: pnpm deploy